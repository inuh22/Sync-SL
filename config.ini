[SSH]
location  =  /home/john/.ssh/id_ed25519
known_host =  /home/john/.ssh/known_hosts

# Forge Server
[Forge]
crt = server.crt
fullchain = server.key

# Generic LetsEncrypt Server
[Certbot]
crt = privkey.pem 
fullchain = fullchain.pem

[example.com]
server = Certbot
user = root
ip = 
port = 22
# Forge certs are dynamic
target_path = /etc/nginx/ssl/example.com
# Reverse proxy server  
proxy_path = /etc/nginx/ssl/example.com 

[example.ph]
server = Forge
user = root
ip = 
port = 22
target_path = /etc/nginx/ssl/example.ph
proxy_path = /etc/nginx/ssl/example.ph